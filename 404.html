<!DOCTYPE html>
<html lang="en-CA">
<head>

    intentionally excluded from indexing and has no canonical URL.

    Referrer privacy and Content-Security-Policy are delivered by Cloudflare.
    Do not add conflicting meta policies or inline scripts and styles.
  -->

  <meta name="author" content="Guitard Inc.">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1eee8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121310" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="/css/style.css?v=20260816-1">
</head>

<body>
  <a class="skip-link" href="#error-title">Skip to error details</a>

  <main class="error-layout" aria-labelledby="error-title">
    <figure class="asset-preview">
      <div class="preview-toolbar" aria-hidden="true">
        <span class="toolbar-dot"></span>
        <span class="toolbar-dot"></span>
        <span class="toolbar-dot"></span>
        <span class="toolbar-label">ASSET PREVIEW</span>
      </div>

      <div class="preview-canvas">
        <div class="asset-selection">
          <span class="selection-handle handle-nw" aria-hidden="true"></span>
          <span class="selection-handle handle-ne" aria-hidden="true"></span>
          <span class="selection-handle handle-sw" aria-hidden="true"></span>
          <span class="selection-handle handle-se" aria-hidden="true"></span>

        </div>
        <p class="format-badge" aria-hidden="true">404 · IMAGE</p>
      </div>

      <figcaption>
        <span>Requested asset</span>
        <strong>Preview unavailable</strong>
      </figcaption>
    </figure>

    <section class="error-copy">
      <p class="eyebrow">ASSET DELIVERY</p>
      <p class="status-code" aria-hidden="true">404</p>
      <h1 id="error-title">Page Not Found</h1>
      <p class="error-message">The requested image may have moved, been renamed, or never existed at this address.</p>

      <dl class="asset-status">
        <div>
          <dt>Origin</dt>
          <dd>assets.guitard.ca</dd>
        </div>
        <div>
          <dt>Response</dt>
          <dd>Not found</dd>
        </div>
      </dl>

      <a class="primary-link" href="https://guitard.ca/">Return to Guitard Inc.</a>
    </section>
