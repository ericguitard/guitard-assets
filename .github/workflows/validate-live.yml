name: Validate production

on:
  workflow_dispatch:
  schedule:
    - cron: "27 11 * * *"

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  validate-live:
    name: Validate production origin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate production asset origin
        env:
          LIVE_VALIDATE_ATTEMPTS: 3
          LIVE_VALIDATE_DELAY_MS: 10000
        run: node scripts/validate-live.mjs
